<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Wood Background Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5230" />
      <stop offset="50%" stop-color="#6E3B1E" />
      <stop offset="100%" stop-color="#4A2511" />
    </linearGradient>

    <!-- Wood Plank Pattern Overlay -->
    <linearGradient id="woodPlank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <!-- Journal Cover Pink Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A0B6" />
      <stop offset="50%" stop-color="#E27D9B" />
      <stop offset="100%" stop-color="#C55676" />
    </linearGradient>

    <!-- Page Edges Gradient -->
    <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DFD1" />
      <stop offset="50%" stop-color="#FAF6EE" />
      <stop offset="100%" stop-color="#DCD0C0" />
    </linearGradient>

    <!-- Gold Lock Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Ribbon Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A82848" />
      <stop offset="50%" stop-color="#D8436A" />
      <stop offset="100%" stop-color="#881B35" />
    </linearGradient>

    <!-- Outer Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1A0D08" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Lock Glow / Shadow -->
    <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2D1200" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base App Tile (Rounded Square) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#woodGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#woodPlank)" />

  <!-- Wood Grain Texture Lines -->
  <path d="M 16,120 Q 256,140 496,110" fill="none" stroke="#3A1C0A" stroke-width="2" opacity="0.3" />
  <path d="M 16,240 Q 200,220 496,260" fill="none" stroke="#3A1C0A" stroke-width="2.5" opacity="0.25" />
  <path d="M 16,370 Q 300,390 496,350" fill="none" stroke="#3A1C0A" stroke-width="2" opacity="0.3" />

  <!-- Journal Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- Journal Back Cover Accent -->
    <rect x="108" y="76" width="300" height="364" rx="20" fill="#A0405C" />

    <!-- Paper Block (Pages showing on right/bottom) -->
    <rect x="116" y="82" width="288" height="352" rx="14" fill="url(#pagesGrad)" />
    <!-- Page lines texture -->
    <line x1="400" y1="95" x2="400" y2="425" stroke="#C8BCAC" stroke-width="2" stroke-dasharray="4,3" />
    <line x1="130" y1="430" x2="390" y2="430" stroke="#C8BCAC" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Front Book Cover -->
    <rect x="104" y="76" width="288" height="360" rx="18" fill="url(#coverGrad)" />
    
    <!-- Cover Spine / Stitching Line -->
    <line x1="136" y1="76" x2="136" y2="436" stroke="#B04060" stroke-width="3" />
    <line x1="138" y1="76" x2="138" y2="436" stroke="#F8B6C8" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7" />

    <!-- Ribbon Bookmark Peak (Hanging out the bottom) -->
    <path d="M 280,420 L 280,468 L 298,452 L 316,468 L 316,420 Z" fill="url(#ribbonGrad)" filter="url(#lockShadow)" />

    <!-- Cover Embossed Frame / Border -->
    <rect x="154" y="112" width="216" height="288" rx="12" fill="none" stroke="#F8C0D0" stroke-width="2" opacity="0.5" stroke-dasharray="160, 4, 4, 4" />
    <rect x="158" y="116" width="208" height="280" rx="10" fill="none" stroke="#A03854" stroke-width="1.5" opacity="0.4" />

    <!-- Center Ornament / Decorative Lock Emblem -->
    <g transform="translate(262, 240)" filter="url(#lockShadow)">
      <!-- Gold Frame Circle -->
      <circle cx="0" cy="0" r="46" fill="url(#goldGrad)" stroke="#FFF0B3" stroke-width="2" />
      <circle cx="0" cy="0" r="38" fill="#8C2240" />

      <!-- Padlock Icon (Passphrase/Encryption theme) -->
      <!-- Shackle -->
      <path d="M -12,-4 V -14 A 12,12 0 0,1 12,-14 V -4" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
      <!-- Body -->
      <rect x="-16" y="-5" width="32" height="26" rx="5" fill="url(#goldGrad)" stroke="#FFF8E1" stroke-width="1" />
      <!-- Keyhole -->
      <circle cx="0" cy="5" r="3" fill="#5D1024" />
      <polygon points="-2,6 2,6 3,13 -3,13" fill="#5D1024" />
    </g>

    <!-- Cute Floral / Gold Leaf Corner Accents -->
    <!-- Top Left Accent -->
    <path d="M 172,134 Q 184,134 184,146 Q 184,134 196,134 Q 184,134 184,122 Q 184,134 172,134 Z" fill="#FFE082" opacity="0.8" />
    <!-- Bottom Right Accent -->
    <path d="M 328,370 Q 340,370 340,382 Q 340,370 352,370 Q 340,370 340,358 Q 340,370 328,370 Z" fill="#FFE082" opacity="0.8" />

  </g>
</svg>
